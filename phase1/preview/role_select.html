<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>انتخاب نقش | جوما</title>
<link rel="stylesheet" href="../public_html/assets/css/style.css">
</head>
<body>
<div style="background:#2C3E50;color:#fff;padding:8px 16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>🔍 پیش‌نمایش استاتیک رابط کاربری — جوما فاز ۱ (داده‌ها نمونه است)</span><a href="index.html" style="color:#9FC4F0">⬅ فهرست صفحات</a></div>
<div class="auth-page">
  <div class="auth-brand">
    <img src="../public_html/assets/img/logo.jpg" alt="لوگوی کلینیک جوما">
    <h1>کلینیک جوما</h1>
    <p>سامانهٔ مدیریت مراجعات</p>
  </div>
  <div class="auth-card">

    <h2 style="font-size:20px;color:var(--color-primary);margin-bottom:8px">انتخاب نقش</h2>
    <p class="text-muted text-small mb-3">شما بیش از یک نقش دارید. با کدام نقش وارد می‌شوید؟
      در طول کار هم می‌توانید از دکمهٔ 🔄 در نوار بالا نقش را عوض کنید.</p>
    <form data-guard>
      <label class="radio"><input type="radio" name="role" checked> 🧑‍💼 مدیر</label>
      <label class="radio"><input type="radio" name="role"> 📋 منشی</label>
      <label class="radio"><input type="radio" name="role"> 🩺 درمانگر</label>
      <button type="button" class="btn btn-primary btn-block mt-3">ورود با این نقش</button>
    </form>

  </div>
  <div class="auth-footer">نسخهٔ ۱.۰ | <a href="#">تماس با پشتیبانی</a></div>
</div>
<script src="../public_html/assets/js/app.js"></script>
</body>
</html>

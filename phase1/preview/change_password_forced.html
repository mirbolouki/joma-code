<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تغییر رمز عبور | جوما</title>
<link rel="stylesheet" href="../public_html/assets/css/style.css">
</head>
<body>
<div style="background:#2C3E50;color:#fff;padding:8px 16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>🔍 پیش‌نمایش استاتیک رابط کاربری — جوما فاز ۱ (داده‌ها نمونه است)</span><a href="index.html" style="color:#9FC4F0">⬅ فهرست صفحات</a></div>
<div class="auth-page">
  <div class="auth-brand">
    <img src="../public_html/assets/img/logo.jpg" alt="لوگوی کلینیک جوما">
    <h1>کلینیک جوما</h1>
    <p>سامانهٔ مدیریت مراجعات</p>
  </div>
  <div class="auth-card">

    <div class="alert alert-warning">
      <strong>⚠️ باید رمز خود را تغییر دهید</strong>
      این نخستین ورود شماست. برای امنیت بیشتر، یک رمز قوی انتخاب کنید.
    </div>
    <form data-guard>
      <div class="form-group">
        <label for="cur">رمز فعلی</label>
        <input type="password" id="cur" autocomplete="current-password">
      </div>
      <div class="form-group">
        <label for="np">رمز جدید</label>
        <input type="password" id="np" autocomplete="new-password">
        <div data-strength-for="np"></div>
      </div>
      <div class="form-group">
        <label for="np2">تکرار رمز جدید</label>
        <input type="password" id="np2" autocomplete="new-password">
      </div>
      <button type="button" class="btn btn-primary btn-block">تغییر رمز</button>
    </form>
    <div class="alert alert-info mt-3">💡 نکته: حداقل ۸ نویسه، شامل حداقل یک حرف و یک عدد.</div>

  </div>
  <div class="auth-footer">نسخهٔ ۱.۰ | <a href="#">تماس با پشتیبانی</a></div>
</div>
<script src="../public_html/assets/js/app.js"></script>
</body>
</html>

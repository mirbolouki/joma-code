name: Verify public handoff downloads
on:
  push:
    branches:
      - arena/c1bf60e0-joma-code
    paths:
      - .github/workflows/verify-public-downloads.yml
permissions: {}
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download public URLs without credentials and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/mirbolouki/joma-code/raw/38aba795fa9e162d9f80ccb7d34612b690f3e44b'
          check() {
            local path="$1" digest="$2" dest
            dest="$(mktemp)"
            curl --fail --location --silent --show-error --retry 2 "$base/$path" --output "$dest"
            echo "$digest  $dest" | sha256sum --check
            rm -f "$dest"
          }
          check release/joma-owl-assets-v2.0.0.zip cf6ef0c69898ed938a55ec3e0de2b38d593a60aeb66ef2002eedd0455a0586e9
          check release/joma-owl-test2-integration-v2.1.0.zip 9d01d7ea5bf8cdf256b8268aef02ef5904978af1f886b48bf5373b1f91b7ae66
          check release/joma-owl-documentation-v2.1.0.zip 217ce99a65d756c31135ad7f10ef86f10e2349e93cfb425ce853308eea09b9c8
          check release/SHA256SUMS-v2.1.0 a9f4610ce741a5740a88648d2552f0dc3da78acc5077e607f074fe3a04f64a0b
          check docs/integration-status-v2.1-fa.md a47813a159ab28926ee383189a7c206de679109df56e5dff9706e08dd38d7042
          base='https://github.com/mirbolouki/joma-code/raw/6b23076181e8a084a2ded3b8d7dca665cbce57d6'
          check release/joma-guide-mvp-preview.zip 694dfd0bce33396a0835492b39c2809372b35d2361ac7d1d5ddcb52326ab5fb0
          base='https://github.com/mirbolouki/joma-code/raw/2f60ddd956dfbef582e247e215a0ea3ef61c3a4f'
          check release/joma-guide-mvp-interactive-v2.zip 3cfab6fe02111d13937e2847cd01529ec9453f3b1eec333f2c25b162a940fc0a
          base='https://github.com/mirbolouki/joma-code/raw/820ae7d78388a00a8f236ec887a8e31ecb83ac80'
          check release/joma-guide-conversation-v3.zip 558d1b040561745295880881c0f6ce0e4c756ff20f8eac00266d22b9d7b47680
          base='https://github.com/mirbolouki/joma-code/raw/06208d0b878619e446d56658bfc753c73bc48c53'
          check release/joma-guide-experience-v4.1.zip 8b88e3947c0d143a378188aa00d96d36b87ebe71c2c212b1e0c8b5459170f4ca
          base='https://github.com/mirbolouki/joma-code/raw/6c71ff0d04b8d2c5f4272406a364bf084a86e12a'
          check release/joma-site-readiness-report-v1.0.zip f88a27f3326aca81a0a2edc14e7bea3ff4f2f239ba0d67426e80127aad090e9e
